name: Deploy Listing Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "Website/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest deploy

      # Keeps the Worker's GITHUB_TOKEN secret in sync with the repo secret,
      # so rotating the PAT is a one-place change.
      - name: Sync Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.LISTING_GITHUB_PAT }}
        run: printf '%s' "$GH_PAT" | npx -y wrangler@latest secret put GITHUB_TOKEN
