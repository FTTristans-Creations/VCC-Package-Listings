name = "fttristan-vcc-listing"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Static landing page files (the old Website/ dir from the Pages build).
[assets]
directory = "../Website"
binding = "ASSETS"

# Create with:  wrangler kv namespace create LISTING_CACHE
# then paste the returned id below.
[[kv_namespaces]]
binding = "LISTING_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional but recommended: a fine-grained PAT with read-only access to
# FTTristans-Creations/CCKAdvanced, so the releases call isn't rate-limited
# by shared Worker egress IPs. Set with:  wrangler secret put GITHUB_TOKEN
